[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unit-test-repair-agent"
version = "0.1.0"
description = "A traceable coding agent that repairs failing pytest suites in isolated git worktrees."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.0,<2",
    "langchain-openai>=1.7.0,<2",
    "langgraph>=1.2.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "python-dotenv>=1.0.0,<2",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[project.scripts]
repair-agent = "repair_agent.cli:main"

[tool.setuptools.packages.find]
include = ["repair_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
