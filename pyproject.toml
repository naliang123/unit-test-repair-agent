[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unit-test-repair-agent"
version = "0.1.0"
description = "A traceable coding agent that repairs failing pytest suites in isolated git worktrees."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[project.scripts]
repair-agent = "repair_agent.cli:main"

[tool.setuptools.packages.find]
include = ["repair_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
